[build]
  # Install frontend dependencies first, then build. Using --prefix ensures
  # the frontend folder gets its own install on Netlify build nodes.
  command = "npm --prefix frontend install && npm --prefix frontend run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  # Ensure devDependencies for the frontend are installed during Netlify builds
  NPM_CONFIG_PRODUCTION = "false"

[dev]
  functions = "netlify/functions"
